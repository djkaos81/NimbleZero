# NimbleZero LCD path (measured on hardware, see docs/DISPLAY.md and docs/results/display-kit/):
#   nz_path=1 nz_native=2   send pixels in the panel's own scan order (orientation variant 2)
#   nz_te=1                 start updates on the panel's sync pulse (GPIO 5)
#   nz_cached=1             picture buffers in cached memory
#   nz_async=1              send in the background while the program draws the next frame
#   nz_fbdev_ms=8           pass /dev/fb0 changes on after 8 ms (kernel: 50 ms)
# Vendor behaviour instead: empty file nz-display-original on the boot partition (docs/DISPLAY.md).
options panel_mipi_dbi_m nz_path=1 nz_native=2 nz_te=1 nz_cached=1 nz_async=1 nz_fbdev_ms=8
